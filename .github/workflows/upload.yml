name: Custom ROM Builder Samsung Galaxy A11/M11

onソー
  push:
    branches:
      - A11-M11  # Cambia de 'main' a 'A11-M11'
  workflow_dispatch:
    inputs:
      GSI:
        description: 'Direct link for GSI image'
        required: true
        default: 'https://sourceforge.net/projects/andyyan-gsi/files/lineage-20-td/lineage-20.0-20250606-UNOFFICIAL-a64_bvN.img.gz'
      ARCH:
        description: 'ARM64 or ARM32?'
        required: true
        default: '32'
      NAME:
        description: 'ROM Name'
        required: true
        default: 'LineageOS_20.0_SDM439_ARM32_Vanilla'

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y zip xz-utils unzip p7zip-full wget

    - name: Download and Prepare GSI
      run: |
        mkdir -p rom/gsi
        wget -P rom/gsi ${{ github.event.inputs.GSI }}
        unxz rom/gsi/*.img.xz
        mv rom/gsi/*.img rom/gsi/${{ github.event.inputs.NAME }}.img

    - name: Download a11qzip Script
      run: |
        # Reemplaza con el enlace correcto para a11qzip
        # Por ejemplo, si está en el grupo de Telegram, obtén el enlace y descárgalo
        wget <URL_DEL_SCRIPT_A11QZIP> -O a11qzip
        chmod +x a11qzip
      continue-on-error: true  # En caso de que el enlace no esté disponible

    - name: Build ROM
      run: |
        ./a11qzip rom/gsi/${{ github.event.inputs.NAME }}.img

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: ${{ github.event.inputs.NAME }}
        path: out/*.zip
